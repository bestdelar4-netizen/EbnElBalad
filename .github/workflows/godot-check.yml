name: Godot Project Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Download Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          wget -q "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip" -O godot.zip
          unzip -q godot.zip -d godot-bin
          chmod +x godot-bin/Godot_v4.7.2-stable_linux.x86_64
          godot-bin/Godot_v4.7.2-stable_linux.x86_64 --version

      - name: Import and parse project
        shell: bash
        run: |
          set -o pipefail
          godot-bin/Godot_v4.7.2-stable_linux.x86_64 --headless --editor --path . --quit 2>&1 | tee godot-check.log

      - name: Upload validation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-validation-log
          path: godot-check.log
          if-no-files-found: warn
